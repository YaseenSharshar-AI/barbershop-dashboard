<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barbershop Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--bg:#f5f6f8;--surface:#fff;--text:#1a1d23;--muted:#6b7280;--border:#e5e7eb;--accent:#2f5496;--accent2:#5b8def;color-scheme:light;}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14161a;--surface:#1d2026;--text:#eef0f3;--muted:#9aa2ad;--border:#2c3138;--accent:#6ea0e8;--accent2:#5b8def;color-scheme:dark;}}
  :root[data-theme="dark"]{--bg:#14161a;--surface:#1d2026;--text:#eef0f3;--muted:#9aa2ad;--border:#2c3138;--accent:#6ea0e8;--accent2:#5b8def;color-scheme:dark;}
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 48px;}
  header h1{font-size:1.4rem;margin:0 0 4px;}
  header p{margin:0 0 18px;color:var(--muted);font-size:.85rem;}
  .filters{display:flex;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:20px;}
  .filters label{display:flex;flex-direction:column;font-size:.72rem;color:var(--muted);gap:4px;}
  select{padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.85rem;min-width:130px;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;border-top:3px solid var(--accent);}
  .kpi .label{font-size:.72rem;color:var(--muted);text-transform:uppercase;}
  .kpi .value{font-size:1.4rem;font-weight:700;margin-top:4px;}
  .grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;overflow-x:auto;}
  .card h2{font-size:.9rem;margin:0 0 12px;}
  @media (max-width:760px){.grid,.grid2{grid-template-columns:1fr;}}
  canvas{max-width:100%;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✂️ Barbershop Analytics Dashboard</h1>
    <p>May – October 2025 · Sample data · Filter by month, barber, service</p>
  </header>

  <div class="filters">
    <label>Month<select id="fMonth"><option value="all">All months</option></select></label>
    <label>Barber<select id="fBarber"><option value="all">All barbers</option></select></label>
    <label>Service<select id="fService"><option value="all">All services</option></select></label>
  </div>

  <div class="kpis" id="kpiRow"></div>

  <div class="grid">
    <div class="card"><h2>Revenue Trend</h2><canvas id="trendChart" height="110"></canvas></div>
    <div class="card"><h2>Revenue by Barber</h2><canvas id="barberChart" height="130"></canvas></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Top Services by Revenue</h2><canvas id="svcChart" height="140"></canvas></div>
    <div class="card"><h2>Booking Status</h2><canvas id="statusChart" height="140"></canvas></div>
  </div>
</div>

function fmt(n){return Math.round(n).toLocaleString();}

const fMonth = document.getElementById('fMonth');
const fBarber = document.getElementById('fBarber');
const fService = document.getElementById('fService');
DATA.meta.months.forEach(m=>fMonth.innerHTML += `<option value="${m}">${m}</option>`);
DATA.meta.barbers.forEach(b=>fBarber.innerHTML += `<option value="${b}">${b}</option>`);
DATA.meta.services.forEach(s=>fService.innerHTML += `<option value="${s}">${s}</option>`);

let charts = {};
function destroyCharts(){ Object.values(charts).forEach(c=>c.destroy()); charts={}; }

function render(){
  const mF = fMonth.value, bF = fBarber.value, sF = fService.value;
  const rows = DATA.rows.filter(r => (mF==='all'||r[0]===mF) && (bF==='all'||r[1]===bF) && (sF==='all'||r[2]===sF));

  const totalRevenue = rows.reduce((a,r)=>a+r[5],0);
  const totalBookings = rows.reduce((a,r)=>a+r[4],0);
  const completedCount = rows.filter(r=>r[3]==='Completed').reduce((a,r)=>a+r[4],0);
  const avgTicket = completedCount ? totalRevenue/completedCount : 0;
  const completionRate = totalBookings ? (completedCount/totalBookings*100) : 0;

  document.getElementById('kpiRow').innerHTML = [
    {l:'Total Revenue', v: fmt(totalRevenue)+' EGP'},
    {l:'Total Bookings', v: fmt(totalBookings)},
    {l:'Avg Ticket', v: fmt(avgTicket)+' EGP'},
    {l:'Completion Rate', v: completionRate.toFixed(1)+'%'},
  ].map(k=>`<div class="kpi"><div class="label">${k.l}</div><div class="value">${k.v}</div></div>`).join('');

  // revenue trend by month
  const monthsUsed = mF==='all' ? DATA.meta.months : [mF];
  const trendVals = monthsUsed.map(m => rows.filter(r=>r[0]===m).reduce((a,r)=>a+r[5],0));

  // revenue by barber
  const barbersUsed = bF==='all' ? DATA.meta.barbers : [bF];
  const barberVals = barbersUsed.map(b => rows.filter(r=>r[1]===b).reduce((a,r)=>a+r[5],0));

  // top services
  const servicesUsed = sF==='all' ? DATA.meta.services : [sF];
  const svcRevenue = servicesUsed.map(s => rows.filter(r=>r[2]===s).reduce((a,r)=>a+r[5],0));
  const svcSorted = servicesUsed.map((s,i)=>({s, v:svcRevenue[i]})).sort((a,b)=>b.v-a.v);

  // status breakdown
  const statusLabels = ['Completed','No-show','Cancelled'];
  const statusVals = statusLabels.map(st => rows.filter(r=>r[3]===st).reduce((a,r)=>a+r[4],0));

  destroyCharts();
  const styles = getComputedStyle(document.documentElement);
  const border = styles.getPropertyValue('--border').trim();
  const accent = styles.getPropertyValue('--accent').trim();
  Chart.defaults.color = styles.getPropertyValue('--muted').trim();
  Chart.defaults.font.family = 'Arial';

  charts.trend = new Chart(document.getElementById('trendChart'), {
    type:'line',
    data:{labels:monthsUsed, datasets:[{label:'Revenue', data:trendVals, borderColor:accent, backgroundColor:'rgba(91,141,239,0.15)', fill:true, tension:.3, pointRadius:3}]},
    options:{plugins:{legend:{display:false}}, scales:{x:{grid:{color:border}}, y:{grid:{color:border}, beginAtZero:true}}}
  });
  charts.barber = new Chart(document.getElementById('barberChart'), {
    type:'bar',
    data:{labels:barbersUsed, datasets:[{label:'Revenue', data:barberVals, backgroundColor:accent, borderRadius:4}]},
    options:{plugins:{legend:{display:false}}, scales:{x:{grid:{display:false}}, y:{grid:{color:border}, beginAtZero:true}}}
  });
  charts.svc = new Chart(document.getElementById('svcChart'), {
    type:'bar',
    data:{labels:svcSorted.map(x=>x.s), datasets:[{label:'Revenue', data:svcSorted.map(x=>x.v), backgroundColor:accent, borderRadius:4}]},
    options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{grid:{color:border}, beginAtZero:true}, y:{grid:{display:false}}}}
  });
  charts.status = new Chart(document.getElementById('statusChart'), {
    type:'doughnut',
    data:{labels:statusLabels, datasets:[{data:statusVals, backgroundColor:['#1e8e5a','#c0392b','#e8923f']}]},
    options:{plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:10}}}}}
  });
}

[fMonth, fBarber, fService].forEach(el => el.addEventListener('change', render));
render();
</script>
